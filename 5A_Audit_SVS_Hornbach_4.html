<script>
let audits = JSON.parse(localStorage.getItem('audits')||'[]');
let arbeitsplaetze = JSON.parse(localStorage.getItem('arbeitsplaetze') || '["Feinkontrolle 1","Montage 2","Verpackung"]');
let currentAudit = null, stream, qrScanner;

function next(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='arbeitsplaetze') renderArbeitsplatzList();
  if(id==='start') renderArbeitsplatzSelect();
}

function renderArbeitsplatzSelect(){
  const s=document.getElementById('arbeitsplatz-select');
  s.innerHTML='';
  arbeitsplaetze.forEach(ap=>{
    const o=document.createElement('option');
    o.value=ap;
    o.textContent=ap;
    s.appendChild(o);
  });
}

function renderArbeitsplatzList(){
  const l=document.getElementById('arbeitsplatz-list');
  l.innerHTML='';
  arbeitsplaetze.forEach((ap,i)=>{
    const d=document.createElement('div');
    d.className='arbeitsplatz-option';
    d.innerHTML=ap+' <button onclick="removeArbeitsplatz('+i+')">Entfernen</button>';
    l.appendChild(d);
  });
}

function addArbeitsplatz(){
  const i=document.getElementById('neuer-arbeitsplatz');
  const n=i.value.trim();
  if(n && !arbeitsplaetze.includes(n)){
    arbeitsplaetze.push(n);
    localStorage.setItem('arbeitsplaetze',JSON.stringify(arbeitsplaetze));
    i.value='';
    renderArbeitsplatzList();
    renderArbeitsplatzSelect();
  }
}

function removeArbeitsplatz(i){
  arbeitsplaetze.splice(i,1);
  localStorage.setItem('arbeitsplaetze',JSON.stringify(arbeitsplaetze));
  renderArbeitsplatzList();
  renderArbeitsplatzSelect();
}

function startAudit(){
  const s=document.getElementById('arbeitsplatz-select');
  const ap=s.value;
  const now=new Date();
  const datum=now.toLocaleDateString('de-DE');
  const uhrzeit=now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  currentAudit={datum,arbeitsplatz:ap,auditor:'Sven Schweer',uhrzeit,fotos:[],antworten:{}};
  next('a1');
}

function saveAnswer(stufe,wert){
  if(currentAudit) currentAudit.antworten[stufe]=wert;
}

function openCamera(){
  document.getElementById('camera').style.display='flex';
  navigator.mediaDevices.getUserMedia({video:true})
    .then(s=>{
      stream=s;
      document.getElementById('video').srcObject=stream;
    })
    .catch(()=>{
      alert('Kamera-Zugriff verweigert!');
      closeCamera();
    });
}

function takePhoto(){
  const v=document.getElementById('video');
  const c=document.getElementById('canvas');
  c.width=v.videoWidth;
  c.height=v.videoHeight;
  const ctx=c.getContext('2d');
  ctx.drawImage(v,0,0);
  const dataUrl=c.toDataURL('image/png');
  if(currentAudit) currentAudit.fotos.push(dataUrl);
  closeCamera();
  alert('Foto aufgenommen!');
}

function abortPhoto(){ closeCamera(); }

function closeCamera(){
  document.getElementById('camera').style.display='none';
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
}

function finishAudit(){
  if(currentAudit){
    audits.push(currentAudit);
    localStorage.setItem('audits',JSON.stringify(audits));
    document.getElementById('result-info').innerHTML=
      'Arbeitsplatz: '+currentAudit.arbeitsplatz+'<br>'+
      'Datum: '+currentAudit.datum+'<br>'+
      'Auditor: '+currentAudit.auditor;
    currentAudit=null;
  }
}

function showArchive(){
  const a=document.getElementById('archive-entries');
  a.innerHTML='';
  audits.forEach(audit=>{
    const e=document.createElement('div');
    e.className='archive-entry';
    e.innerHTML='<strong>'+audit.datum+'</strong> – Arbeitsplatz: '+audit.arbeitsplatz+
                ' – Auditor: '+audit.auditor+'<br>Antworten: '+JSON.stringify(audit.antworten);
    (audit.fotos||[]).forEach(f=>{
      const img=document.createElement('img');
      img.src=f;
      img.className='photo-entry';
      e.appendChild(img);
    });
    a.appendChild(e);
  });
}

function exportAuditsAsPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  let y=10;
  audits.forEach((audit,idx)=>{
    doc.text(`Audit ${idx+1}:`,10,y); y+=8;
    doc.text(`Datum: ${audit.datum}`,10,y); y+=8;
    doc.text(`Arbeitsplatz: ${audit.arbeitsplatz}`,10,y); y+=8;
    doc.text(`Auditor: ${audit.auditor}`,10,y); y+=8;
    doc.text(`Uhrzeit: ${audit.uhrzeit||''}`,10,y); y+=8;
    doc.text(`Antworten: ${JSON.stringify(audit.antworten)}`,10,y,{maxWidth:180}); y+=10;

    if(audit.fotos && audit.fotos.length>0){
      audit.fotos.forEach(foto=>{
        doc.addImage(foto,'PNG',10,y,40,30);
        y+=35;
        if(y>250){ doc.addPage(); y=10; }
      });
    }
    y+=10;
    if(y>250){ doc.addPage(); y=10; }
  });
  doc.save("audits.pdf");
}

function exportAuditsAsCSV(){
  let csv='Datum;Arbeitsplatz;Auditor;Uhrzeit;Antworten;Fotos (Base64, Komma getrennt)\n';
  audits.forEach(audit=>{
    let fotos=(audit.fotos||[]).join(',');
    csv+=`${audit.datum};${audit.arbeitsplatz};${audit.auditor};${audit.uhrzeit||''};${JSON.stringify(audit.antworten)};${fotos}\n`;
  });
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='audits.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function startQRScanner(){
  qrScanner=new Html5Qrcode("reader");
  qrScanner.start(
    {facingMode:"environment"},
    {fps:10,qrbox:250},
    qrCodeMessage=>{
      if(arbeitsplaetze.includes(qrCodeMessage)){
        document.getElementById('arbeitsplatz-select').value=qrCodeMessage;
        stopQRScanner();
        startAudit();
      } else {
        alert('QR-Code ungültig oder Arbeitsplatz nicht vorhanden!');
      }
    }
  ).catch(err=>{
    alert("Kamera-Fehler oder kein Zugriff möglich!");
  });
}

function stopQRScanner(){
  if(qrScanner){
    qrScanner.stop().then(()=>qrScanner.clear()).catch(()=>{});
  }
}

renderArbeitsplatzSelect();
</script>
